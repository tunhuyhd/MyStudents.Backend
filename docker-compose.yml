services:
  mystudents.api:
    image: mystudents-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=mystudents.db;Database=MyStudents;Username=${POSTGRES_USER:-mystudents};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JwtSettings__Key: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      mystudents.db:
        condition: service_healthy

  mystudents.db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: MyStudents
      POSTGRES_USER: ${POSTGRES_USER:-mystudents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mystudents} -d MyStudents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
