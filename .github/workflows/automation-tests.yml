name: Backend automation tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MyStudents.slnx
      - run: dotnet test MyStudents.slnx --no-restore --configuration Release --logger "trx;LogFileName=automation.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-test-results
          path: TestResults/**/*.trx
