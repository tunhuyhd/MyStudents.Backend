name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build MyStudents.slnx --configuration Release
      - run: dotnet test tests/MyStudents.AutomationTests/MyStudents.AutomationTests.csproj --configuration Release --no-build
